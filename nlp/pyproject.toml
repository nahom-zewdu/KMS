[project]
name = "nlp"
version = "0.1.0"
description = "AI-powered knowledge oracle for SaaS/fintech teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "openai>=2.7.1",
    "pydantic>=2.12.4",
    "pyjwt[crypto]>=2.10.1",
    "pygithub>=2.9.1",
    "python-dotenv>=1.2.1",
    "python-json-logger>=4.0.0",
    "redis==5.0.8",
    "sentence-transformers>=5.1.2",
    "supabase>=2.24.0",
    "tqdm>=4.67.1",
    "uvicorn>=0.47.0",
]

[tool.pytest.ini_options]
# Tests currently exercise both package-qualified imports (nlp.*) and
# NLP-service-local imports (ramp.*, api). Keep both roots available when
# pytest is invoked from the nlp/ project directory.
pythonpath = ["..", "."]
